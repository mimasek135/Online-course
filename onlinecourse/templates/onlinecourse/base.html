{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OnlineCourse{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{% static 'onlinecourse/site.css' %}">
<style>body{background:#f4f7fb;color:#182b49}main{max-width:960px}.brand{font-weight:700;letter-spacing:.04em}.hero{background:#132e52;color:white;border-radius:16px;padding:32px;margin-bottom:24px}.card{border:1px solid #dce3ed;border-radius:12px}.muted{color:#5a6f88}.eyebrow{letter-spacing:.16em;font-size:12px;text-transform:uppercase}.score{font-size:40px;font-weight:700}.question{margin-bottom:20px}</style>
</head><body><nav class="navbar navbar-dark bg-dark px-4 mb-4"><a class="navbar-brand brand" href="{% url 'onlinecourse:index' %}">OnlineCourse</a><div class="text-white">{% if user.is_authenticated %}{{ user.username }} <form class="d-inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light ms-3">Log out</button></form>{% else %}<a class="btn btn-outline-light" href="{% url 'login' %}">Log in</a>{% endif %}</div></nav>
<main class="container pb-5">{% block content %}{% endblock %}</main></body></html>
